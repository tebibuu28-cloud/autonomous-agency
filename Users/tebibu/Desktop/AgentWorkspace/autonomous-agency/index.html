<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agent Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: Arial; }
        #ui { position: absolute; top: 10px; left: 10px; }
    </style>
</head>
<body>
    <div id="ui"><h1>Engine: <span id="status">Connecting...</span></h1></div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshBasicMaterial({wireframe: true, color: 0x00ff00}));
        scene.add(sphere);
        camera.position.z = 3;
        
        async function updateDashboard() {
    const res = await fetch('http://127.0.0.1:8000/status');
    const data = await res.json();
    
    // Update the UI with Enterprise Metrics
    document.getElementById('status').innerText = data.system_health;
    
    // If system is degraded, change sphere color to Red
    if(data.system_health !== "OPERATIONAL") {
        sphere.material.color.set(0xff0000);
    } else {
        sphere.material.color.set(0x00ff00);
    }
}

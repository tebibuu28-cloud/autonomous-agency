<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous Agency | Enterprise Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans p-10">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-5xl font-black mb-6 bg-gradient-to-r from-blue-400 to-purple-600 bg-clip-text text-transparent">
            Autonomous Agency Engine 🚀
        </h1>
        
        <div class="flex gap-4 mb-8">
            <button onclick="openTab('features')" class="px-6 py-2 bg-blue-600 rounded-full font-bold">Features</button>
            <button onclick="openTab('tech')" class="px-6 py-2 bg-slate-800 rounded-full font-bold">Architecture</button>
        </div>

        <div id="features" class="tab-content bg-slate-900 p-8 rounded-2xl border border-slate-800">
            <h2 class="text-2xl font-bold mb-4">💎 Premium Production Features</h2>
            <ul class="space-y-3">
                <li>✅ <b>Dual-Inference Routing:</b> Intelligent LLM fallback engine.</li>
                <li>✅ <b>10x Resiliency Guards:</b> Built-in telemetry and health checks.</li>
                <li>✅ <b>Incremental Versioning:</b> Complete isolation of text builds.</li>
            </ul>
        </div>
    </div>
    <script>
        function openTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
